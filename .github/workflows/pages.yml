name: Deploy site factory to GitHub Pages
# Production publishing is enabled in repository settings.

on:
  push:
    branches: [main]
    paths:
      - "site_factory/public/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Build requested site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site_factory/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
