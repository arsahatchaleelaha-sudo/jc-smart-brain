[project]
name = "jc-smart-brain"
version = "0.1.0"
description = "สมองกลางที่ทุก agent เรียกใช้ร่วมกัน — cache-first, grounded, compliance-guarded"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "rank-bm25>=0.2,<1",
    "anthropic>=1.3,<2",
]

[project.optional-dependencies]
vector = ["chromadb>=1.5,<2"]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]

[tool.setuptools.package-data]
brain = ["kb/*.json"]
