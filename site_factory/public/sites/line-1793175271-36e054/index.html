<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เว็บไซต์ของคุณ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Reset & base styles */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; font-family:system-ui, sans-serif; line-height:1.6; color:#333; background:#fafafa; }
  a { color:#0066cc; text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* Layout containers */
  .container { max-width:800px; margin:auto; padding:1rem; }
  header, footer { background:#f8f8f8; padding:1rem; }
  header h1 { margin:0; font-size:1.5rem; }
  nav ul { list-style:none; padding:0; margin:0; display:flex; gap:1rem; }
  nav a { font-weight:600; }

  /* Sections */
  section { margin-bottom:2rem; }
  section h2 { margin-top:0; font-size:1.4rem; }
  .product-grid { display:grid; grid-template-columns:1fr; gap:1rem; }
  .product { background:#fff; padding:1rem; border-radius:4px; box-shadow:0 1px 3px rgba(0,0,0,.1); }

  /* Mobile-first: stack everything */
  @media(min-width:600px) {
    .product-grid { grid-template-columns:1fr 1fr; }
  }

  footer p { margin:0; font-size:0.9rem; text-align:center; }
</style>
</head>
<body>
<header class="container">
  <h1>เว็บไซต์ของคุณ</h1>
  <nav>
    <ul>
      <li><a href="#home">หน้าแรก</a></li>
      <li><a href="#products">สินค้า</a></li>
      <li><a href="#about">เกี่ยวกับเรา</a></li>
      <li><a href="#contact">ติดต่อ</a></li>
    </ul>
  </nav>
</header>

<main class="container">
  <!-- Home / Hero -->
  <section id="home">
    <h2>ร้านของขวัญไทย – ขนมปังปิ้งโรงงาน & ของฝาก</h2>
    <p>ยินดีต้อนรับสู่ร้านของขวัญไทย ร้านที่ผสมผสานความอร่อยของขนมปังปิ้งโรงงานและของฝากแบบไทย ๆ ให้คุณเลือกสรรได้ตามใจชอบ</p>
</html>
